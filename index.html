<script>

function setAkhir(){
  let mulai = document.getElementById("mulai").value;
  if(mulai){
    let date = new Date(mulai);
    date.setMonth(date.getMonth()+3);
    document.getElementById("akhir").value = date.toISOString().split('T')[0];
  }
}

function generate(){
  let riskText = document.getElementById("risk").value === "pure"
    ? "Seluruh kerugian menjadi tanggung jawab Eksekutor. Investor memperoleh 10% dari profit bersih."
    : "Kerugian dibagi dua antara kedua pihak. Profit bersih dibagi 50% : 50%.";

  document.getElementById("preview").innerHTML = `
  <b>Tanggal Mulai:</b> ${mulai.value}<br>
  <b>Tanggal Berakhir:</b> ${akhir.value}<br><br>

  <b>PIHAK PERTAMA (Investor):</b> ${investor.value}<br>
  <b>PIHAK KEDUA (Eksekutor):</b> ${eksekutor.value}<br><br>

  <b>DANA:</b> Investor menyediakan 20.000 cent (± $200). 
  Eksekutor hanya memiliki hak eksekusi tanpa withdrawal.<br><br>

  <b>SISTEM:</b> Maksimal 3 transaksi per hari. 
  Maksimal loss harian 5%.<br><br>

  <b>SKEMA RISIKO:</b> ${riskText}<br><br>

  <b>FORCE CLOSE:</b> Jika drawdown mencapai ${dd.value}%, 
  seluruh posisi ditutup dan kerja sama dihentikan.
  `;
}

/* SIGNATURE SUPPORT ALL DEVICE (HP + DESKTOP) */
function initCanvas(id){
  const canvas = document.getElementById(id);
  const ctx = canvas.getContext("2d");

  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;

  ctx.lineWidth = 2;
  ctx.lineCap = "round";

  let drawing = false;

  // supaya tidak scroll saat tanda tangan di HP
  canvas.style.touchAction = "none";

  canvas.addEventListener("pointerdown", (e)=>{
    drawing = true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
  });

  canvas.addEventListener("pointermove", (e)=>{
    if(!drawing) return;
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
  });

  canvas.addEventListener("pointerup", ()=>{
    drawing = false;
    ctx.beginPath();
  });

  canvas.addEventListener("pointerleave", ()=>{
    drawing = false;
    ctx.beginPath();
  });
}

function clearCanvas(id){
  const c = document.getElementById(id);
  c.getContext("2d").clearRect(0,0,c.width,c.height);
}

initCanvas("sign1");
initCanvas("sign2");

</script>
